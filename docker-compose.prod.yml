# FOASIS — production Compose (university VM)
#
# Public entry: Nginx :80 (and :443 when TLS is added)
# Internal only: Next.js, NestJS, PostgreSQL
#
# Setup:
#   1. Copy docker.prod.env.example → .env  (repo root; gitignored)
#   2. Fill secrets (JWT_SECRET, POSTGRES_PASSWORD, RESEND_API_KEY, PUBLIC_URL)
#   3. docker compose -f docker-compose.prod.yml --env-file .env up --build -d
#
# Do not use: docker compose down -v  (that deletes Postgres + upload volumes)

name: foasis

services:
  postgres:
    image: postgres:16-alpine
    container_name: foasis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - foasis_postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./apps/foasis-backend
      dockerfile: Dockerfile
    image: foasis-backend:prod
    container_name: foasis-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - foasis_uploads:/app/uploads
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    image: foasis-frontend:prod
    container_name: foasis-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3007"
      HOSTNAME: 0.0.0.0
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3007').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    image: foasis-nginx:prod
    container_name: foasis-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    # Uncomment when TLS files exist on the VM:
    # volumes:
    #   - /etc/foasis/tls:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  edge:
    driver: bridge
  data:
    driver: bridge

volumes:
  foasis_postgres_data:
    name: foasis_postgres_data
  foasis_uploads:
    name: foasis_uploads
